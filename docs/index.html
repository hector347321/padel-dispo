<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Padel libre">
<meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Padel libre</title>
<style>
:root{
  --bg:#f4f2ec; --card:#fffdf8; --fg:#1b1c19; --mut:#76746c; --line:#e3e0d6;
  --acc:#1d6b47; --acc-bg:#e2efe7; --chip:#ebe8df; --warn:#a3521b;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121311; --card:#1b1c1a; --fg:#ecebe5; --mut:#99978e; --line:#2b2c29;
    --acc:#6fd3a0; --acc-bg:#1f3329; --chip:#252623; --warn:#e59a63;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;
  border-bottom:1px solid transparent;transition:border-color .2s}
header.scrolled{border-bottom-color:var(--line)}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 0 2px;font-weight:700}
.meta{color:var(--mut);font-size:13px}
.meta b{color:var(--fg);font-weight:600}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);color:var(--fg);font:inherit;font-size:14px;font-weight:500;
  padding:8px 13px;border-radius:999px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.chip small{opacity:.6;font-weight:400;margin-left:4px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:8px;font-size:14px;color:var(--mut)}
.filters select{font:inherit;color:var(--fg);background:var(--chip);border:0;border-radius:10px;padding:7px 10px;-webkit-appearance:none;appearance:none}
.filters button{font:inherit;font-size:14px;color:var(--acc);background:none;border:0;padding:6px 2px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:26px 2px 8px;font-weight:600}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
a.slot{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,max-content);gap:10px;align-items:center;padding:12px 14px;
  color:inherit;text-decoration:none;border-top:1px solid var(--line)}
a.slot:first-child{border-top:0}
a.slot:active{background:var(--chip)}
.t{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.c{min-width:0}
.c b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p{text-align:right;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mut);line-height:1.5}
.p em{font-style:normal;color:var(--acc);background:var(--acc-bg);padding:1px 6px;border-radius:6px;font-weight:600;font-size:12px}
.tag{display:inline-block;font-size:11px;color:var(--warn);margin-left:6px;font-weight:500}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.clubs{font-size:14px}
.clubs .list div{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.clubs .list div:first-child{border-top:0}
.clubs a{color:var(--acc);text-decoration:none}
.ok{color:var(--mut)} .ko{color:var(--warn)}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:24px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bell{flex:none;border:0;background:var(--acc-bg);color:var(--acc);font:inherit;font-size:14px;font-weight:600;
  padding:8px 13px;border-radius:999px;margin-bottom:4px}
/* Feuille alertes */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(30px + env(safe-area-inset-bottom))}
.sheet .in{max-width:640px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 0 4px}
.bar button{font:inherit;color:var(--acc);background:none;border:0;padding:8px 0;font-weight:600}
.sheet h3{font-size:22px;margin:4px 0 6px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.rule{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule b{font-weight:600}
.rule span{color:var(--mut);font-size:13px;grid-column:1}
.rule .acts{grid-row:1/span 2;grid-column:2;display:flex;gap:6px;align-items:center}
.ibtn{border:0;background:var(--chip);color:var(--fg);font:inherit;font-size:13px;padding:6px 10px;border-radius:9px}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw:checked{background:var(--acc)} .sw:checked::after{left:21px}
.off b,.off span{opacity:.45}
.add{width:100%;margin-top:12px;border:1.5px dashed var(--line);background:none;color:var(--acc);font:inherit;font-weight:600;padding:13px;border-radius:var(--r)}
.form{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.form label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.form label:first-child{margin-top:0}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:7px;border-radius:8px;color:var(--fg)}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.wrap .chip{padding:7px 11px}
.fl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:14px}
.fl select,.fl input{font:inherit;font-size:15px;color:var(--fg);background:var(--chip);border:0;border-radius:10px;padding:8px 10px;-webkit-appearance:none;appearance:none}
.go{display:flex;gap:8px;margin-top:16px}
.go button{flex:1;font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px}
.primary{background:var(--acc);color:#fff}
@media (prefers-color-scheme: dark){.primary{color:#0d1a13}}
.ghost{background:var(--chip);color:var(--fg)}
.msg{font-size:13px;margin-top:10px;min-height:1em}
.msg.err{color:var(--warn)} .msg.ok{color:var(--acc)}
.howto{font-size:14px;color:var(--mut);line-height:1.5}
.howto ol{padding-left:20px;margin:8px 0}
.howto a{color:var(--acc)}
.tok{width:100%;font:inherit;font-size:14px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin-top:8px}
</style>
</head>
<body>
<main>
  <header id="hd">
    <div class="top">
      <div><h1>Padel libre</h1><div class="meta" id="meta">Chargement…</div></div>
      <button class="bell" id="bellBtn" type="button">🔔 Alertes</button>
    </div>
    <div class="row" id="days"></div>
    <div class="filters">
      <select id="from" aria-label="Dès"></select>
      <span>à</span>
      <select id="to" aria-label="Jusqu'à"></select>
      <select id="dur" aria-label="Durée">
        <option value="60">≥ 60 min</option>
        <option value="90">90 min</option>
      </select>
      <button id="clubsBtn" type="button">Clubs</button>
    </div>
    <div class="row" id="clubRow" hidden></div>
  </header>
  <div id="out"></div>
  <section class="clubs" id="clubs"></section>
  <p class="foot">Mis à jour automatiquement toutes les 15 min · usage privé</p>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="in">
    <div class="bar"><span></span><button id="closeSheet" type="button">Terminé</button></div>
    <h3>Mes alertes</h3>
    <p class="sub">Choisis des dates précises et des heures : une notification part uniquement quand un créneau se libère dedans. Les dates passées disparaissent toutes seules.</p>
    <div id="rules"></div>
    <div id="formBox"></div>
    <button class="add" id="addRule" type="button">+ Ajouter une date</button>
    <div class="msg" id="saveMsg"></div>
    <div id="tokBox"></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const JF = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const MF = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const store = {
  get(k, d){ try{ const v = localStorage.getItem("padel:"+k); return v==null ? d : JSON.parse(v);}catch(e){return d} },
  set(k, v){ try{ localStorage.setItem("padel:"+k, JSON.stringify(v)); }catch(e){} }
};
let DATA = null;
const st = {
  day: "all",
  from: store.get("from", "17:00"),
  to: store.get("to", "22:00"),
  dur: store.get("dur", "60"),
  off: new Set(store.get("off", [])),
};

const hours = [];
for (let h = 6; h <= 23; h++) for (const m of ["00","30"]) hours.push(String(h).padStart(2,"0")+":"+m);
for (const id of ["from","to"]) {
  $("#"+id).innerHTML = hours.map(h => `<option>${h}</option>`).join("");
  $("#"+id).value = st[id];
  $("#"+id).onchange = e => { st[id] = e.target.value; store.set(id, st[id]); render(); };
}
$("#dur").value = st.dur;
$("#dur").onchange = e => { st.dur = e.target.value; store.set("dur", st.dur); render(); };
$("#clubsBtn").onclick = () => { $("#clubRow").hidden = !$("#clubRow").hidden; };
addEventListener("scroll", () => $("#hd").classList.toggle("scrolled", scrollY > 4), {passive:true});

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayLabel = iso => {
  const d = new Date(iso+"T12:00");
  const t = new Date(); t.setHours(12,0,0,0);
  const diff = Math.round((d - t)/864e5);
  if (diff === 0) return "Aujourd'hui";
  if (diff === 1) return "Demain";
  return `${JF[d.getDay()]} ${d.getDate()} ${MF[d.getMonth()]}`;
};
const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso))/6e4);
  return m < 1 ? "à l'instant" : m < 60 ? `il y a ${m} min` : `il y a ${Math.floor(m/60)} h ${m%60}`;
};

function matches(x){
  const hm = x.debut.slice(11,16);
  if (hm < st.from || hm > st.to) return false;
  if (st.off.has(x.club)) return false;
  if (!x.durees.some(d => d.min >= +st.dur)) return false;
  if (new Date(x.debut) < new Date()) return false;
  return true;
}

function render(){
  if (!DATA) return;
  const all = DATA.creneaux.filter(matches);
  // Jours
  const days = [...new Set(DATA.creneaux.map(x => x.debut.slice(0,10)))].sort();
  const counts = {}; all.forEach(x => { const d = x.debut.slice(0,10); counts[d] = (counts[d]||0)+1; });
  if (st.day !== "all" && !days.includes(st.day)) st.day = "all";
  $("#days").innerHTML = [`<button class="chip" data-d="all" aria-pressed="${st.day==="all"}">Tout<small>${all.length}</small></button>`]
    .concat(days.map(d => `<button class="chip" data-d="${d}" aria-pressed="${st.day===d}">${dayLabel(d)}<small>${counts[d]||0}</small></button>`)).join("");
  $("#days").querySelectorAll("button").forEach(b => b.onclick = () => { st.day = b.dataset.d; render(); });

  // Clubs (filtre)
  const noms = DATA.clubs.filter(c => c.etat !== "lien").map(c => c.club);
  $("#clubRow").innerHTML = noms.map(n => `<button class="chip" data-c="${esc(n)}" aria-pressed="${!st.off.has(n)}">${esc(n)}</button>`).join("");
  $("#clubRow").querySelectorAll("button").forEach(b => b.onclick = () => {
    const n = b.dataset.c; st.off.has(n) ? st.off.delete(n) : st.off.add(n);
    store.set("off", [...st.off]); render();
  });
  $("#clubsBtn").textContent = st.off.size ? `Clubs (${noms.length - st.off.size}/${noms.length})` : "Clubs";

  // Liste
  const list = st.day === "all" ? all : all.filter(x => x.debut.startsWith(st.day));
  const byDay = {};
  list.forEach(x => (byDay[x.debut.slice(0,10)] ||= []).push(x));
  let html = "";
  for (const d of Object.keys(byDay).sort()) {
    html += `<h2>${dayLabel(d)}</h2><div class="list">`;
    for (const x of byDay[d]) {
      const prix = x.durees.filter(u => u.min >= +st.dur || x.durees.length === 1)
        .map(u => `${u.min}′${u.prix ? " · " + esc(u.prix) : ""}`).join("<br>");
      const tags = (x.tags||[]).map(t => `<span class="tag">${t === "single" ? "simple (2 j.)" : t === "outdoor" ? "extérieur" : esc(t)}</span>`).join("");
      html += `<a class="slot" href="${esc(x.url)}" target="_blank" rel="noopener">
        <span class="t">${x.debut.slice(11,16)}</span>
        <span class="c"><b>${esc(x.club)}${tags}</b><span>${esc(x.ville)} · ${esc(x.court)}</span></span>
        <span class="p">${prix}</span></a>`;
    }
    html += `</div>`;
  }
  $("#out").innerHTML = html || `<div class="empty">Aucun terrain libre entre ${st.from} et ${st.to}.<br>Élargis la plage horaire ou les jours.</div>`;

  // État des clubs
  const etat = c => c.etat === "ok" ? `<span class="ok">${c.n} créneaux</span>`
    : c.etat === "lien" ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">Ouvrir ↗</a>`
    : `<span class="ko" title="${esc(c.erreur)}">indisponible</span>`;
  $("#clubs").innerHTML = `<h2>Clubs suivis</h2><div class="list">` +
    DATA.clubs.map(c => `<div><span>${esc(c.club)} <span class="ok">· ${esc(c.ville)}${c.note ? " · "+esc(c.note) : ""}</span></span>${etat(c)}</div>`).join("") + `</div>`;

  $("#meta").innerHTML = `<b>${all.length}</b> créneaux libres · mis à jour ${ago(DATA.maj)}`;
}

/* ───────────── Alertes (enregistrées dans alertes.json du dépôt GitHub) ───────────── */
const REPO = (() => {
  const owner = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "hector347321";
  const repo = location.hostname.endsWith(".github.io") ? (location.pathname.split("/")[1] || "padel-dispo") : "padel-dispo";
  return {owner, repo, api: `https://api.github.com/repos/${owner}/${repo}/contents/alertes.json`};
})();
const JOURS = [["lun","Lu"],["mar","Ma"],["mer","Me"],["jeu","Je"],["ven","Ve"],["sam","Sa"],["dim","Di"]];
let AL = {doc: null, sha: null, rules: [], editing: null};

const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));
const token = () => store.get("ghtoken", "");

async function loadAlertes(){
  const h = {Accept: "application/vnd.github+json"};
  if (token()) h.Authorization = "Bearer " + token();
  const r = await fetch(REPO.api + "?t=" + Date.now(), {headers: h, cache: "no-store"});
  if (!r.ok) throw new Error("lecture " + r.status);
  const j = await r.json();
  AL.sha = j.sha;
  AL.doc = JSON.parse(b64dec(j.content));
  AL.rules = AL.doc.alertes || [];
}

async function saveAlertes(){
  const msg = $("#saveMsg");
  if (!token()) { renderToken(true); msg.className = "msg err"; msg.textContent = "Connecte d'abord GitHub (en bas) pour enregistrer."; return false; }
  msg.className = "msg"; msg.textContent = "Enregistrement…";
  // Nettoyage : on retire les dates passées
  const today = new Date().toISOString().slice(0,10);
  AL.rules = AL.rules.map(r => r.dates ? {...r, dates: r.dates.filter(d => d >= today)} : r)
                     .filter(r => !r.dates || r.dates.length);
  const doc = {...(AL.doc || {}), alertes: AL.rules};
  const put = async () => fetch(REPO.api, {
    method: "PUT",
    headers: {Accept: "application/vnd.github+json", Authorization: "Bearer " + token()},
    body: JSON.stringify({message: "alertes mises à jour depuis l'iPhone", content: b64enc(JSON.stringify(doc, null, 2) + "\n"), sha: AL.sha})
  });
  let r = await put();
  if (r.status === 409 || r.status === 422) { const keep = AL.rules; await loadAlertes(); AL.rules = keep; r = await put(); }
  if (!r.ok) {
    msg.className = "msg err";
    msg.textContent = r.status === 401 || r.status === 403 ? "Jeton GitHub refusé : vérifie-le en bas." : "Échec de l'enregistrement (" + r.status + ").";
    if (r.status === 401 || r.status === 403) renderToken(true);
    return false;
  }
  AL.sha = (await r.json()).content.sha;
  AL.doc = doc;
  msg.className = "msg ok"; msg.textContent = "Enregistré ✓ Actif dès le prochain passage (≤ 15 min).";
  return true;
}

const fmtDate = iso => { const d = new Date(iso + "T12:00"); return `${JF[d.getDay()]} ${d.getDate()} ${MF[d.getMonth()]}`; };
function describe(r){
  let quand;
  if (r.dates && r.dates.length) quand = r.dates.map(fmtDate).join(", ");
  else {
    const j = r.jours || JOURS.map(x => x[0]);
    const k = j.join(",");
    quand = k === "lun,mar,mer,jeu,ven" ? "Lun – ven" : k === "sam,dim" ? "Week-end" : j.length === 7 ? "Tous les jours"
      : j.map(x => x[0].toUpperCase() + x.slice(1)).join(", ");
  }
  const det = [`${r.de || "00:00"} – ${r.a || "23:59"}`, `≥ ${r.duree_min || 60} min`];
  if (r.clubs && r.clubs.length) det.push(r.clubs.join(", "));
  return {quand, det: det.join(" · ")};
}

function renderRules(){
  const box = $("#rules");
  AL.rules = AL.rules.filter(r => r.dates && r.dates.length);
  if (!AL.rules.length) { box.innerHTML = `<div class="list"><div class="empty" style="padding:22px">Aucune alerte : tu ne recevras aucune notification. Ajoute une date et une plage horaire.</div></div>`; return; }
  box.innerHTML = `<div class="list">` + AL.rules.map((r, i) => {
    const d = describe(r);
    return `<div class="rule ${r.actif === false ? "off" : ""}"><b>${esc(d.quand)}</b><span>${esc(d.det)}</span>
      <div class="acts"><button class="ibtn" data-e="${i}" type="button">Modifier</button>
      <input class="sw" type="checkbox" data-t="${i}" ${r.actif === false ? "" : "checked"} aria-label="Activer"></div></div>`;
  }).join("") + `</div>`;
  box.querySelectorAll("[data-e]").forEach(b => b.onclick = () => openForm(+b.dataset.e));
  box.querySelectorAll("[data-t]").forEach(b => b.onchange = async () => {
    AL.rules[+b.dataset.t].actif = b.checked; renderRules(); await saveAlertes();
  });
}

function openForm(i){
  const isNew = i == null;
  const r = isNew ? {dates: [], de: "18:00", a: "21:00", duree_min: 60, clubs: [], sans_simple: true}
                  : JSON.parse(JSON.stringify(AL.rules[i]));
  const mode = "dates";
  r.jours = r.jours || ["lun","mar","mer","jeu","ven"];
  r.dates = r.dates || [];
  r.clubs = r.clubs || [];
  const clubs = DATA ? DATA.clubs.filter(c => c.etat !== "lien").map(c => c.club) : [];
  const hOpts = v => hours.map(h => `<option ${h === v ? "selected" : ""}>${h}</option>`).join("");
  const today = new Date().toISOString().slice(0,10);
  $("#addRule").hidden = true;
  const draw = () => {
    $("#formBox").innerHTML = `<div class="form">
      <label>Date(s)</label>
      <div>${`<div class="fl"><input type="date" id="fDate" min="${today}" value="${today}"><button type="button" class="ibtn" id="fAddDate">Ajouter</button></div>
           <div class="wrap" style="margin-top:8px">${r.dates.map(d => `<button type="button" class="chip" data-d="${d}" aria-pressed="true">${fmtDate(d)} ✕</button>`).join("") || `<span class="sub" style="margin:0">Choisis une ou plusieurs dates.</span>`}</div>`}</div>
      <label>Plage horaire (début du créneau)</label>
      <div class="fl"><select id="fDe">${hOpts(r.de)}</select> à <select id="fA">${hOpts(r.a)}</select></div>
      <label>Durée minimale</label>
      <div class="fl"><select id="fDur"><option value="60" ${r.duree_min==60?"selected":""}>60 min</option><option value="90" ${r.duree_min==90?"selected":""}>90 min</option></select></div>
      <label>Clubs <span style="opacity:.7">(aucun sélectionné = tous)</span></label>
      <div class="wrap">${clubs.map(c => `<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="${r.clubs.includes(c)}">${esc(c)}</button>`).join("")}</div>
      <div class="go">${isNew ? "" : `<button type="button" class="ghost" id="fDel">Supprimer</button>`}<button type="button" class="ghost" id="fCancel">Annuler</button><button type="button" class="primary" id="fSave">Enregistrer</button></div>
    </div>`;
    const keep = () => { r.de = $("#fDe").value; r.a = $("#fA").value; r.duree_min = +$("#fDur").value; };
    $("#formBox").querySelectorAll("[data-d]").forEach(b => b.onclick = () => { keep(); r.dates = r.dates.filter(x => x !== b.dataset.d); draw(); });
    $("#formBox").querySelectorAll("[data-c]").forEach(b => b.onclick = () => { keep(); const c = b.dataset.c; r.clubs = r.clubs.includes(c) ? r.clubs.filter(x => x !== c) : [...r.clubs, c]; draw(); });
    if ($("#fAddDate")) $("#fAddDate").onclick = () => { keep(); const v = $("#fDate").value; if (v && !r.dates.includes(v)) r.dates = [...r.dates, v].sort(); draw(); };
    $("#fCancel").onclick = closeForm;
    if ($("#fDel")) $("#fDel").onclick = async () => { AL.rules.splice(i, 1); closeForm(); renderRules(); await saveAlertes(); };
    $("#fSave").onclick = async () => {
      keep();
      const msg = $("#saveMsg");
      if (r.de > r.a) { msg.className = "msg err"; msg.textContent = "L'heure de début doit être avant l'heure de fin."; return; }
      const out = {de: r.de, a: r.a, duree_min: r.duree_min, clubs: r.clubs, sans_simple: r.sans_simple !== false};
      if (r.actif === false) out.actif = false;
      if (!r.dates.length) { msg.className = "msg err"; msg.textContent = "Ajoute au moins une date."; return; }
      out.dates = r.dates;
      if (isNew) AL.rules.push(out); else AL.rules[i] = out;
      closeForm(); renderRules(); await saveAlertes();
    };
  };
  draw();
  $("#formBox").scrollIntoView({behavior: "smooth", block: "start"});
}
function closeForm(){ $("#formBox").innerHTML = ""; $("#addRule").hidden = false; }

function renderToken(open){
  const has = !!token();
  $("#tokBox").innerHTML = `<h2>Connexion GitHub</h2><div class="howto">
    ${has && !open ? `Connecté : tes modifications sont enregistrées dans ton dépôt. <button class="ibtn" id="tokEdit" type="button">Changer</button>`
    : `Pour enregistrer depuis ce téléphone, colle un jeton GitHub (à faire une seule fois) :
      <ol><li>Ouvre <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com → Fine-grained token</a></li>
      <li>Repository access : <b>Only select repositories</b> → <b>${esc(REPO.repo)}</b></li>
      <li>Permissions → Repository → <b>Contents : Read and write</b></li>
      <li>Generate, copie le jeton et colle-le ici :</li></ol>
      <input class="tok" id="tokIn" type="password" autocomplete="off" placeholder="github_pat_…">
      <div class="go"><button class="primary" id="tokSave" type="button">Connecter</button></div>
      <div class="sub" style="margin-top:8px">Le jeton reste uniquement sur ce téléphone.</div>`}</div>`;
  if ($("#tokEdit")) $("#tokEdit").onclick = () => renderToken(true);
  if ($("#tokSave")) $("#tokSave").onclick = async () => {
    const v = $("#tokIn").value.trim(); if (!v) return;
    store.set("ghtoken", v);
    try { await loadAlertes(); renderRules(); renderToken(false); $("#saveMsg").className = "msg ok"; $("#saveMsg").textContent = "GitHub connecté ✓"; }
    catch (e) { store.set("ghtoken", ""); renderToken(true); $("#saveMsg").className = "msg err"; $("#saveMsg").textContent = "Jeton refusé, vérifie-le."; }
  };
}

$("#bellBtn").onclick = async () => {
  $("#sheet").hidden = false; document.body.style.overflow = "hidden";
  $("#saveMsg").textContent = ""; closeForm(); renderToken(false);
  $("#rules").innerHTML = `<div class="list"><div class="empty" style="padding:22px">Chargement…</div></div>`;
  try { await loadAlertes(); renderRules(); }
  catch (e) { $("#rules").innerHTML = `<div class="list"><div class="empty" style="padding:22px">Impossible de lire tes alertes (${esc(e.message)}).</div></div>`; }
};
$("#closeSheet").onclick = () => { $("#sheet").hidden = true; document.body.style.overflow = ""; };
$("#addRule").onclick = () => openForm(null);

async function load(){
  try {
    const r = await fetch("data.json?t=" + Date.now(), {cache: "no-store"});
    DATA = await r.json();
    render();
  } catch (e) {
    $("#meta").textContent = "Impossible de charger les données. Réessaie dans un instant.";
  }
}
load();
setInterval(load, 5*60*1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
